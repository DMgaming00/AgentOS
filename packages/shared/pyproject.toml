[project]
name = "agentos-core"
version = "0.1.0"
description = "AgentOS shared domain, persistence, workflow engine, providers and tools"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "structlog>=24.4",
  "opentelemetry-api>=1.29",
  "opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "anthropic>=2.3",
  "openai>=3.37",
  "pypdf>=5.1",
  "jsonschema>=4.23",
  "openeval",
]

[tool.uv.sources]
openeval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos_core"]
