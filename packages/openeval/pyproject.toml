[project]
name = "openeval"
version = "0.1.0"
description = "Deterministic-first evaluation of AI agents on versioned benchmark datasets"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openeval"]
