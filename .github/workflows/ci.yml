name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agentos, POSTGRES_PASSWORD: agentos, POSTGRES_DB: agentos }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentos" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy packages/shared/agentos_core apps/api/agentos apps/worker/agentos_worker packages/openeval/openeval
      - name: Migrations (upgrade, downgrade, drift)
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini check
      - name: Tests (unit + integration on real PostgreSQL; no LLM calls)
        run: uv run pytest -p no:warnings -rs
      - name: Hard evaluation set matches its builder
        run: uv run python scripts/build_hard_eval.py --check
      - name: OpenAPI client is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code apps/web/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          # start every service (api, 2 workers, web); `--wait api` alone would leave workers and web down
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf http://localhost:8000/ready >/dev/null && break; sleep 2; done
          for i in $(seq 1 90); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 2; done
          curl -sf http://localhost:8000/ready >/dev/null || { docker compose ps; docker compose logs --no-color | tail -50; exit 1; }
          curl -sf http://localhost:3000/login >/dev/null || { docker compose ps; exit 1; }
          sleep 10  # let the workers register their first heartbeat
          docker compose ps
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.13.5" }
      - run: uv sync --frozen
      - name: Demos (API-driven, includes real worker crashes)
        run: uv run python scripts/demo.py all
      - name: Autopilot demos (mock provider; repair, fake-improvement rejection, rollback)
        run: uv run python scripts/autopilot_demo.py all
      - name: Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            compose.log
            apps/web/playwright-report
