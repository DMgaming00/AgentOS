[project]
name = "agentos-api"
version = "0.1.0"
description = "AgentOS REST API"
requires-python = ">=3.12"
dependencies = [
  "agentos-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyjwt>=2.10",
  "python-multipart>=0.0.18",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.scripts]
agentos-api = "agentos.main:run"

[tool.uv.sources]
agentos-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentos"]
